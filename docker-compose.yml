services:
  api:
    build:
      context: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DBNAME: "${DBNAME:-penghitung_sembako}"
      DBUSER: "${DBUSER:-root}"
      DBPASS: "${DBPASS:-root}"
      DBHOST: mysql
      DBPORT: 3306
      DBDIALECT: mysql
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
      MINIO_BUCKET: "${MINIO_BUCKET:-groceries}"
      MINIO_URL: "${MINIO_URL:-http://localhost:9000}"
      MINIO_PRESIGNED_URL: "${MINIO_PRESIGNED_URL:-http://localhost:9000}"
      MINIO_PRESIGNED_ENDPOINT: localhost
      MINIO_PRESIGNED_PORT: 9000
      MINIO_PRESIGNED_USE_SSL: "false"
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: "${DBNAME:-penghitung_sembako}"
      MYSQL_ROOT_PASSWORD: "${DBPASS:-root}"
    ports:
      - "${DBPORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: bitnamilegacy/minio:latest
    command: server /bitnami/minio/data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-minioadmin}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  minio_data:
